<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ATUKMAO: The Future Tiger</title>
<style>
  :root{
    color-scheme:dark;
    --bg-deep:#071310;
    --panel-dark:#0b1d17e6;
    --panel-mid:#122b23d9;
    --border-emerald:#3c6e5a66;
    --accent-cyan:#4df7d4;
    --accent-gold:#ffd86b;
    --text-main:#f3f7f2;
    --text-muted:#9ebbb0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #game{position:fixed;inset:0}
  #game:after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,#05100d66 0%,transparent 22%,transparent 76%,#040d0a99 100%),
      radial-gradient(ellipse at 50% 50%,transparent 48%,#030b0855 100%);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ================= PHASE 2: INTERACTIVE 3D LOBBY UI ================= */
  #lobbyUI{
    position:absolute;inset:0;pointer-events:none;color:var(--text-main);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    z-index:20;transition:opacity .32s ease;
  }
  .lobby-top{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .lobby-brand{
    pointer-events:auto;
    background:linear-gradient(145deg,var(--panel-mid),var(--panel-dark));
    border:1px solid var(--border-emerald);
    box-shadow:0 8px 24px #00000055,inset 0 1px #ffffff18;
    border-radius:16px;padding:9px 14px;backdrop-filter:blur(12px);
  }
  .lobby-brand-title{
    font-weight:900;font-size:15px;letter-spacing:.08em;color:#fff;
    display:flex;align-items:center;gap:7px;
  }
  .lobby-brand-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent-cyan);box-shadow:0 0 10px var(--accent-cyan);
  }
  .lobby-brand-sub{
    font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--accent-cyan);margin-top:2px;
  }
  .coin-pill{
    pointer-events:auto;
    background:linear-gradient(145deg,var(--panel-mid),var(--panel-dark));
    border:1px solid #ffd86b66;
    box-shadow:0 8px 24px #00000055,inset 0 1px #ffffff18;
    border-radius:999px;padding:8px 15px;backdrop-filter:blur(12px);
    display:flex;align-items:center;gap:8px;
  }
  .coin-icon{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff6b8,#ffd86b 55%,#c88a14 100%);
    box-shadow:0 0 10px #ffd86b88;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:#231800;
  }
  .coin-label{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--text-muted)}
  .coin-val{font-size:18px;font-weight:900;color:var(--accent-gold);text-shadow:0 0 12px #ffd86b44}

  .lobby-bottom{
    display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:420px;margin:0 auto;
  }
  .lobby-Inspect-tag{
    background:#081813cc;border:1px solid #4df7d444;border-radius:999px;
    padding:5px 14px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--accent-cyan);
    backdrop-filter:blur(8px);
  }
  .run-btn{
    pointer-events:auto;cursor:pointer;touch-action:manipulation;
    width:100%;max-width:280px;border:0;border-radius:18px;padding:16px 26px;
    background:linear-gradient(135deg,#ffe47a 0%,#f3b634 52%,#34d9b5 100%);
    color:#0b1a14;font-weight:950;font-size:19px;letter-spacing:.14em;
    box-shadow:0 12px 32px #34d9b544,0 4px 14px #ffd86b55,inset 0 1px #ffffffaa;
    transition:transform .12s ease;
  }
  .run-btn:active{transform:scale(.96)}

  .lobby-nav{
    pointer-events:auto;
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;
  }
  .nav-btn{
    cursor:pointer;touch-action:manipulation;
    background:linear-gradient(145deg,var(--panel-mid),var(--panel-dark));
    border:1px solid var(--border-emerald);border-radius:14px;padding:10px 6px;
    color:var(--text-main);font-weight:800;font-size:10px;letter-spacing:.08em;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    box-shadow:0 6px 18px #00000055,inset 0 1px #ffffff14;backdrop-filter:blur(10px);
    transition:transform .12s,border-color .15s;
    position:relative;
  }
  .nav-btn:active{transform:scale(.95)}
  .nav-btn.active{border-color:var(--accent-cyan);color:var(--accent-cyan)}
  .nav-ico{font-size:15px;line-height:1}
  .nav-badge-dot{
    position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;
    background:#ffbb33;box-shadow:0 0 8px #ffd86b;display:none;
  }

  /* Lobby Modal for Shop & Missions */
  #lobbyModal{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,12,9,0.72);backdrop-filter:blur(8px);padding:20px;pointer-events:auto;
  }
  .modal-card{
    max-width:410px;width:100%;border-radius:22px;padding:20px 18px;
    background:linear-gradient(155deg,#112921f5,#071410f8);
    border:1px solid #4df7d466;box-shadow:0 24px 70px #000c,inset 0 1px #ffffff1f;
    color:var(--text-main);text-align:center;max-height:88vh;display:flex;flex-direction:column;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-shrink:0}
  .modal-title{font-size:17px;font-weight:900;letter-spacing:.08em;color:var(--accent-gold)}
  .modal-close{
    cursor:pointer;border:1px solid var(--border-emerald);background:#0c211acc;
    color:var(--text-main);border-radius:10px;width:32px;height:32px;font-weight:900;
  }
  .modal-body{font-size:13px;color:#cde0d6;line-height:1.5;text-align:left;margin-bottom:12px;overflow-y:auto;padding-right:2px}
  .modal-item{
    display:flex;justify-content:space-between;align-items:center;
    background:#091914cc;border:1px solid #3c6e5a55;border-radius:12px;
    padding:9px 12px;margin-top:8px;font-size:12px;
  }
  .modal-item b{color:var(--accent-cyan)}

  /* ================= PART 4: SHOP SYSTEM STYLES ================= */
  .shop-header-bar{
    display:flex;justify-content:space-between;align-items:center;
    background:#081813ee;border:1px solid #ffd86b55;border-radius:12px;
    padding:8px 12px;margin-bottom:10px;
  }
  .shop-header-label{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--text-muted)}
  .shop-header-coin{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:var(--accent-gold)}
  .shop-notice{
    min-height:18px;font-size:11px;font-weight:800;letter-spacing:.06em;
    text-align:center;margin-bottom:6px;color:#ff7b7b;transition:opacity .2s;
  }
  .shop-skill-list{display:flex;flex-direction:column;gap:10px}
  .shop-card{
    background:linear-gradient(145deg,#0d241ce8,#081712f2);
    border:1px solid #4df7d444;border-radius:15px;padding:11px 12px;
    display:flex;flex-direction:column;gap:8px;
    box-shadow:0 6px 16px #00000044,inset 0 1px #ffffff12;
  }
  .shop-card-top{display:flex;align-items:center;gap:10px}
  .shop-ico{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;
    border:1px solid #ffffff28;box-shadow:0 4px 12px #0006;
  }
  .shop-ico.magnet{background:radial-gradient(circle at 30% 30%,#ff6b8b,#b81d43 75%);color:#fff}
  .shop-ico.rocket{background:radial-gradient(circle at 30% 30%,#ffb347,#d44216 75%);color:#fff}
  .shop-ico.x2{background:radial-gradient(circle at 30% 30%,#ffe678,#b87d0e 75%);color:#1a1200}
  .shop-info{flex:1;min-width:0}
  .shop-name-row{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .shop-name{font-size:13px;font-weight:900;letter-spacing:.06em;color:#fff}
  .shop-lvl-badge{
    font-size:10px;font-weight:900;letter-spacing:.08em;
    padding:2px 8px;border-radius:999px;
    background:#103328;border:1px solid #4df7d466;color:var(--accent-cyan);
  }
  .shop-lvl-badge.max{background:#33280d;border-color:#ffd86b88;color:var(--accent-gold)}
  .shop-desc{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.3}
  .shop-lvl-bars{
    display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:2px;
  }
  .shop-lvl-seg{
    height:5px;border-radius:3px;background:#163329;border:1px solid #ffffff12;
  }
  .shop-lvl-seg.filled{
    background:linear-gradient(90deg,#34d9b5,#ffd86b);
    box-shadow:0 0 6px #4df7d466;border-color:#ffd86b88;
  }
  .shop-card-foot{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding-top:6px;border-top:1px solid #ffffff12;
  }
  .shop-dur-info{font-size:11px;color:#d6e8df;font-weight:700}
  .shop-dur-info span{color:var(--accent-cyan);font-weight:900}
  .shop-dur-next{color:var(--accent-gold)!important}
  .shop-buy-btn{
    cursor:pointer;touch-action:manipulation;
    border:0;border-radius:11px;padding:8px 13px;min-width:112px;
    background:linear-gradient(135deg,#ffe47a 0%,#e5a926 100%);
    color:#141b14;font-weight:900;font-size:11px;letter-spacing:.06em;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    box-shadow:0 4px 12px #0006,inset 0 1px #ffffffaa;
    transition:transform .1s,opacity .15s;
  }
  .shop-buy-btn:active{transform:scale(.95)}
  .shop-buy-btn.insufficient{
    background:linear-gradient(135deg,#2a3b34,#1a2622);
    color:#9ebbb0;border:1px solid #ffffff22;box-shadow:none;
  }
  .shop-buy-btn.maxed{
    cursor:default;background:linear-gradient(135deg,#1d4235,#112920);
    color:var(--accent-cyan);border:1px solid #4df7d466;box-shadow:none;
  }

  /* ================= PHASE 6: DAILY ENERGY CAPSULE & MISSIONS STYLES ================= */
  .capsule-box{
    background:linear-gradient(145deg,#123328f2,#091c16f8);
    border:1px solid #ffd86b77;border-radius:15px;padding:11px 12px;margin-bottom:12px;
    box-shadow:0 8px 22px #00000055,inset 0 1px #ffffff18;
  }
  .capsule-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .capsule-title{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--accent-gold);display:flex;align-items:center;gap:6px}
  .capsule-streak{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:#0b241c;border:1px solid #4df7d455;color:var(--accent-cyan)}
  .capsule-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:9px;
  }
  .cap-day{
    background:#091914cc;border:1px solid #3c6e5a55;border-radius:9px;padding:5px 2px;
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .cap-day.claimed{background:#12382b;border-color:#4df7d488;opacity:.75}
  .cap-day.today{
    background:linear-gradient(145deg,#2c4c38,#152e23);
    border:1.5px solid var(--accent-gold);
    box-shadow:0 0 10px #ffd86b44;
  }
  .cap-day-num{font-size:8px;font-weight:900;color:var(--text-muted);letter-spacing:.04em}
  .cap-day.today .cap-day-num{color:var(--accent-gold)}
  .cap-day-ico{font-size:12px;line-height:1.1}
  .cap-day-val{font-size:8px;font-weight:800;color:#fff;line-height:1.1}
  .capsule-claim-btn{
    cursor:pointer;touch-action:manipulation;width:100%;border:0;border-radius:11px;padding:9px 12px;
    background:linear-gradient(135deg,#ffe47a 0%,#e5a926 55%,#34d9b5 100%);
    color:#0e1c16;font-weight:900;font-size:11px;letter-spacing:.08em;
    box-shadow:0 4px 14px #34d9b544,inset 0 1px #ffffffaa;
  }
  .capsule-claim-btn:disabled{
    cursor:default;background:#132a22;color:#7fa396;border:1px solid #3c6e5a55;box-shadow:none;
  }
  .mission-sec-title{
    font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--accent-cyan);
    margin:10px 0 6px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;
  }
  .mission-card{
    background:linear-gradient(145deg,#0d241ce8,#081712f2);
    border:1px solid #3c6e5a66;border-radius:13px;padding:9px 11px;margin-bottom:7px;
    display:flex;flex-direction:column;gap:6px;
  }
  .mission-card.ready{border-color:var(--accent-gold);box-shadow:0 0 12px #ffd86b22}
  .mission-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .mission-name{font-size:12px;font-weight:800;color:#fff;line-height:1.3}
  .mission-reward-tag{
    font-size:10px;font-weight:900;color:var(--accent-gold);white-space:nowrap;
    background:#1c2d1f;border:1px solid #ffd86b55;padding:2px 7px;border-radius:999px;
  }
  .mission-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mission-prog-wrap{flex:1;display:flex;flex-direction:column;gap:3px}
  .mission-prog-bar{height:6px;background:#071410;border-radius:999px;overflow:hidden;border:1px solid #ffffff14}
  .mission-prog-fill{height:100%;background:linear-gradient(90deg,#34d9b5,#ffd86b);border-radius:999px;transition:width .2s}
  .mission-prog-txt{font-size:9px;font-weight:800;color:var(--text-muted)}
  .mission-claim-btn{
    cursor:pointer;touch-action:manipulation;border:0;border-radius:9px;padding:6px 11px;
    font-size:10px;font-weight:900;letter-spacing:.06em;min-width:78px;
    background:linear-gradient(135deg,#ffe47a,#e5a926);color:#141b14;
  }
  .mission-claim-btn:disabled{
    cursor:default;background:#132820;color:#729387;border:1px solid #ffffff14;
  }
  .mission-claim-btn.done{
    background:#103328;color:var(--accent-cyan);border:1px solid #4df7d455;
  }

  /* ================= PHASE 3 & 4: GAMEPLAY HUD ================= */
  #hud{
    position:absolute;inset:0;pointer-events:none;color:var(--text-main);
    display:none;z-index:15;
  }
  #hud:before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px #02080688}
  .top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 0;
  }
  .hud-left-col{
    display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  }
  .hud-right-col{
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  }
  .pill{
    background:linear-gradient(145deg,var(--panel-mid),var(--panel-dark));
    border:1px solid var(--border-emerald);
    box-shadow:0 8px 24px #00000055,inset 0 1px #ffffff14;
    border-radius:16px;padding:9px 14px;backdrop-filter:blur(12px);
    font-weight:750;font-size:12px;letter-spacing:.05em;
  }
  .stats-pill{text-align:right;min-width:136px}
  .stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stat-row + .stat-row{margin-top:3px;padding-top:3px;border-top:1px solid #ffffff12}
  .stat-lbl{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--text-muted)}
  #energy{font-size:15px;font-weight:900;color:var(--accent-gold);text-shadow:0 0 10px #ffd86b44}
  #score{font-size:19px;font-weight:900;color:#fff;text-shadow:0 0 14px #4df7d444}

  /* PART 6: ACTIVE SKILL HUD INDICATORS */
  #activeSkillsHud{
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
    pointer-events:none;
  }
  .skill-hud-pill{
    display:none;align-items:center;gap:7px;
    background:linear-gradient(145deg,#0d241ce8,#071410f2);
    border:1px solid #4df7d466;border-radius:12px;padding:5px 9px;
    box-shadow:0 6px 16px #00000066,inset 0 1px #ffffff18;
    backdrop-filter:blur(10px);min-width:116px;
  }
  .skill-hud-pill.magnet{border-color:#ff6b8baa}
  .skill-hud-pill.rocket{border-color:#ffb347aa}
  .skill-hud-pill.x2{border-color:#ffe678aa}
  .skill-hud-ico{
    width:22px;height:22px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;flex-shrink:0;
  }
  .skill-hud-pill.magnet .skill-hud-ico{background:#c9244b;color:#fff}
  .skill-hud-pill.rocket .skill-hud-ico{background:#d94b1a;color:#fff}
  .skill-hud-pill.x2 .skill-hud-ico{background:#e5a926;color:#1a1200}
  .skill-hud-meta{flex:1;display:flex;flex-direction:column;gap:3px}
  .skill-hud-top{display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:900;letter-spacing:.08em}
  .skill-hud-name{color:#e6f4ee}
  .skill-hud-time{color:var(--accent-gold);font-variant-numeric:tabular-nums}
  .skill-hud-bar{
    width:100%;height:4px;border-radius:999px;background:#07130f;overflow:hidden;
  }
  .skill-hud-fill{
    width:100%;height:100%;border-radius:999px;
    background:linear-gradient(90deg,#4df7d4,#ffd86b);
    transition:width .08s linear;
  }

  /* PHASE 4: UPPER-LEFT VERTICAL SHIELD EVOLUTION HUD (NO FRACTION TEXT) */
  #evoShieldHud{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:linear-gradient(160deg,var(--panel-mid),var(--panel-dark));
    border:1.5px solid var(--border-emerald);
    border-radius:20px;padding:8px 7px 10px;
    box-shadow:0 10px 26px #00000066,inset 0 1px #ffffff1a;
    backdrop-filter:blur(12px);
    transition:border-color .25s,box-shadow .25s,transform .2s;
  }
  #evoShieldHud.evo-active{
    border-color:var(--accent-gold);
    box-shadow:0 0 24px #ffd86b77,0 0 12px #4df7d466,inset 0 1px #ffffff44;
    transform:scale(1.04);
  }
  .shield-emblem{
    width:28px;height:30px;border-radius:9px;
    background:radial-gradient(circle at 50% 30%,#1b4235,#091914);
    border:1px solid #4df7d466;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px #ffffff22;
    transition:background .25s,border-color .25s,box-shadow .25s;
  }
  #evoShieldHud.evo-active .shield-emblem{
    background:radial-gradient(circle at 50% 30%,#fff4b8,#ffd86b 55%,#29e0b9 100%);
    border-color:#fff;
    box-shadow:0 0 14px #ffd86b;
  }
  .shield-svg{
    width:17px;height:19px;fill:var(--accent-cyan);
    filter:drop-shadow(0 0 4px #4df7d488);
    transition:fill .25s;
  }
  #evoShieldHud.evo-active .shield-svg{
    fill:#0c221a;
    filter:none;
  }
  .evo-vtrack{
    width:12px;height:78px;border-radius:999px;
    background:#06110ddd;border:1px solid #ffffff1f;
    overflow:hidden;position:relative;
    display:flex;align-items:flex-end;
    box-shadow:inset 0 2px 6px #000a;
  }
  #evoVFill{
    width:100%;height:0%;border-radius:999px;
    background:linear-gradient(0deg,#25b89a 0%,#4df7d4 55%,#ffd86b 100%);
    box-shadow:0 0 12px #4df7d499;
    transition:height .14s ease-out;
  }
  #evoShieldHud.evo-active #evoVFill{
    background:linear-gradient(0deg,#ff55aa 0%,#ffd86b 50%,#4df7d4 100%);
    box-shadow:0 0 16px #ffd86b;
  }
  #evoTimerBadge{
    font-size:10px;font-weight:900;letter-spacing:.04em;
    color:var(--accent-gold);text-shadow:0 0 8px #ffd86b66;
    display:none;line-height:1;margin-top:2px;
  }
  #evoShieldHud.evo-active #evoTimerBadge{
    display:block;
  }

  /* Resume Countdown Badge */
  #countdownBadge{
    position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(0.9);
    z-index:105;pointer-events:none;
    min-width:118px;padding:14px 26px;border-radius:24px;
    background:linear-gradient(145deg,#102920ee,#071410f5);
    border:1.5px solid #4df7d488;
    box-shadow:0 18px 50px #000b,0 0 30px #4df7d433,inset 0 1px #ffffff22;
    backdrop-filter:blur(12px);
    text-align:center;font-weight:950;font-size:44px;letter-spacing:.06em;
    color:#ffd86b;text-shadow:0 0 22px #ffd86b88;

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ============================================================================
// 1. SCENE, CAMERA & FUTURISTIC ENCHANTED FOREST LIGHTING
// ============================================================================
const root = document.querySelector('#game');
const scene = new THREE.Scene();

const skyColor = new THREE.Color(0x88b8a8);
scene.background = skyColor;
scene.fog = new THREE.FogExp2(0x84b5a5, 0.0082);

const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.1, 210);
// Front three-quarter Lobby showcase view (stationary during 360° tiger rotation)
const LOBBY_CAM_POS = new THREE.Vector3(2.45, 2.02, -2.58);
const LOBBY_CAM_LOOK = new THREE.Vector3(0.0, 0.90, 1.86);
const GAME_CAM_POS = new THREE.Vector3(0, 5.0, 10.8);
const GAME_CAM_LOOK = new THREE.Vector3(0, 1.1, -3.0);

camera.position.copy(LOBBY_CAM_POS);
camera.lookAt(LOBBY_CAM_LOOK);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

const hemiLight = new THREE.HemisphereLight(0xf2fff8, 0x1a382c, 2.15);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xfff3d6, 2.85);
sun.position.set(-12, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 65;
sun.shadow.camera.left = -16;
sun.shadow.camera.right = 16;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rimLight = new THREE.DirectionalLight(0x5fffe0, 0.95);
rimLight.position.set(10, 6, -18);
scene.add(rimLight);

// ============================================================================
// 2. PROCEDURAL TEXTURES (WHITE BENGAL TIGER + LUMINOUS NECKLACE)
// ============================================================================
function createBengalBodyTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // Clean snow-white Bengal fur base with soft cream-white underbelly
  const bg = ctx.createLinearGradient(0, 0, 512, 0);
  bg.addColorStop(0.0, '#fcfdfe');
  bg.addColorStop(0.22, '#f2f4f7');
  bg.addColorStop(0.5, '#ffffff');
  bg.addColorStop(0.78, '#f2f4f7');
  bg.addColorStop(1.0, '#fcfdfe');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 512, 512);

  // Directional fur grain
  for (let i = 0; i < 2200; i++) {
    ctx.fillStyle = (i % 2 === 0) ? 'rgba(195,205,216,0.16)' : 'rgba(255,255,255,0.22)';
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 8);
  }

  // Dense, slender, natural branching Bengal tiger stripes along spine & flanks
  ctx.fillStyle = '#181412';
  const yRows = [34, 68, 102, 138, 174, 212, 250, 288, 326, 364, 402, 438, 472];
  yRows.forEach((yPos, idx) => {
    const wave = (idx % 2 === 0 ? 1 : -1) * 9;
    const thickness = 5.5 + (idx % 3) * 1.4;

    // Left flank stripe tapering toward belly
    ctx.beginPath();
    ctx.moveTo(46, yPos + 14);
    ctx.quadraticCurveTo(145, yPos + wave, 240, yPos);
    ctx.lineTo(244, yPos + thickness);
    ctx.quadraticCurveTo(145, yPos + wave + thickness + 2, 46, yPos + 18);
    ctx.closePath();
    ctx.fill();

    // Right flank stripe tapering toward belly
    ctx.beginPath();
    ctx.moveTo(466, yPos + 14);
    ctx.quadraticCurveTo(367, yPos - wave, 272, yPos);
    ctx.lineTo(268, yPos + thickness);
    ctx.quadraticCurveTo(367, yPos - wave + thickness + 2, 466, yPos + 18);
    ctx.closePath();
    ctx.fill();

    // Natural Bengal fork-branching on alternating ribs
    if (idx % 3 === 1) {
      ctx.beginPath();
      ctx.moveTo(105, yPos + 2);
      ctx.quadraticCurveTo(152, yPos + 20, 198, yPos + 24);
      ctx.lineTo(190, yPos + 29);
      ctx.quadraticCurveTo(148, yPos + 24, 98, yPos + 7);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(407, yPos + 2);
      ctx.quadraticCurveTo(360, yPos + 20, 314, yPos + 24);
      ctx.lineTo(322, yPos + 29);
      ctx.quadraticCurveTo(364, yPos + 24, 414, yPos + 7);
      ctx.closePath();
      ctx.fill();
    }
  });

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createBengalChestTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fbfcfd';
  ctx.fillRect(0, 0, 256, 256);

  // Iconic Bengal Tiger V-shaped chest stripes
  ctx.strokeStyle = '#1d1815';
  ctx.lineCap = 'round';
  [54, 98, 144, 190].forEach((y, i) => {
    ctx.lineWidth = 7 - i * 0.8;
    ctx.beginPath();
    ctx.moveTo(32, y - 34);
    ctx.quadraticCurveTo(92, y - 4, 128, y + 18);
    ctx.quadraticCurveTo(164, y - 4, 224, y - 34);
    ctx.stroke();
  });

  const tex = new THREE.CanvasTexture(c);

  return tex;
}

function createBengalFaceTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fbfcfd';
  ctx.fillRect(0, 0, 512, 512);

  for (let i = 0; i < 1100; i++) {
    ctx.fillStyle = 'rgba(200,210,220,0.12)';
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 6);
  }

  ctx.strokeStyle = '#181412';
  ctx.fillStyle = '#181412';
  ctx.lineCap = 'round';

  // Intricate Bengal forehead '王' & crown markings
  [92, 124, 156, 186].forEach((y, i) => {
    ctx.lineWidth = 9 - i * 1.1;
    const span = 78 - i * 14;
    ctx.beginPath();
    ctx.moveTo(256 - span, y + 10);
    ctx.quadraticCurveTo(256, y - 16, 256 + span, y + 10);
    ctx.stroke();
  });

  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(256, 80);
  ctx.lineTo(256, 196);
  ctx.stroke();

  // Cheek & temple tiger stripes framing the facial ruff
  for (let s of [-1, 1]) {
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(256 + s * 112, 186);
    ctx.quadraticCurveTo(256 + s * 172, 240, 256 + s * 124, 310);
    ctx.stroke();

    ctx.lineWidth = 7.5;
    ctx.beginPath();
    ctx.moveTo(256 + s * 136, 232);
    ctx.quadraticCurveTo(256 + s * 190, 286, 256 + s * 142, 348);
    ctx.stroke();

    ctx.lineWidth = 6.5;
    ctx.beginPath();
    ctx.moveTo(256 + s * 96, 272);
    ctx.quadraticCurveTo(256 + s * 142, 312, 256 + s * 112, 362);
    ctx.stroke();  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createCollarTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 256, 0);
  g.addColorStop(0, '#f3e8ee');
  g.addColorStop(0.5, '#f9f2f6');
  g.addColorStop(1, '#f3e8ee');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 64);

  for (let x = 10; x < 256; x += 24) {
    ctx.fillStyle = '#d8a6bc';
    ctx.beginPath();
    ctx.arc(x, 32, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#b9d4df';
    ctx.fillRect(x + 9, 25, 5, 14);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createForestRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 512, 0);
  grad.addColorStop(0.0, '#1e382b');
  grad.addColorStop(0.08, '#3d473d');
  grad.addColorStop(0.5, '#485247');
  grad.addColorStop(0.92, '#3d473d');
  grad.addColorStop(1.0, '#1e382b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2200; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    ctx.fillStyle = (i % 3 === 0) ? 'rgba(30,42,34,0.18)' : 'rgba(130,148,125,0.10)';
    ctx.fillRect(x, y, 4 + Math.random() * 6, 4 + Math.random() * 8);
  }
  ctx.fillStyle = 'rgba(46, 88, 62, 0.35)';
  for (let i = 0; i < 90; i++) {
    ctx.beginPath();
    ctx.arc(Math.random() < 0.5 ? Math.random() * 55 : 457 + Math.random() * 55, Math.random() * 512, 8 + Math.random() * 14, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 14);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function box(parent, w, h, d, material, x, y, z, rx = 0, ry = 0, rz = 0) {

function sphere(parent, sx, sy, sz, material, x, y, z, rx = 0, ry = 0, rz = 0) {

function cyl(parent, rt, rb, h, material, x, y, z, rx = 0, ry = 0, rz = 0, seg = 16) {

// Anatomical Bengal Tiger torso: deep muscular chest/withers, tucked athletic waist, powerful hindquarters
function buildBengalTigerTorsoGeometry() {
  const geo = new THREE.CylinderGeometry(1, 1, 2.02, 32, 28, false);
  geo.rotateX(Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);
    const t = z / 1.01;
    const endRound = Math.sqrt(Math.max(0.12, 1 - Math.pow(Math.max(0, Math.abs(t) - 0.74) / 0.26, 2)));

    const chestBulge = t < 0 ? (1.0 + 0.22 * Math.exp(-Math.pow((t + 0.54) * 2.2, 2))) : 1.0;
    const waistPinch = 1.0 - 0.19 * Math.exp(-Math.pow((t - 0.16) * 2.5, 2));
    const hipBulge = t > 0 ? (1.0 + 0.12 * Math.exp(-Math.pow((t - 0.64) * 2.5, 2))) : 1.0;

    const widthX = 0.37 * chestBulge * waistPinch * hipBulge * endRound;
    const heightY = 0.39 * (t < 0 ? 1.12 : 0.94) * waistPinch * endRound;

    x *= widthX;
    y *= heightY;

    const withers = (y > 0) ? 0.055 * Math.exp(-Math.pow((t + 0.56) * 2.6, 2)) : 0;
    const bellyTuck = (y < 0) ? 0.115 * Math.exp(-Math.pow((t - 0.22) * 2.2, 2)) : 0;
    y += 0.92 + withers + bellyTuck;
    z += 0.04;

    pos.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
  return geo;
}

function createBengalTigerTail() {
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,  0.00, 0.02),
    new THREE.Vector3(0, -0.18, 0.26),
    new THREE.Vector3(0, -0.38, 0.48),
    new THREE.Vector3(0, -0.42, 0.72),
    new THREE.Vector3(0, -0.24, 0.94)
  ]);

  const c = document.createElement('canvas');
  c.width = 64; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fbfcfd';
  ctx.fillRect(0, 0, 64, 512);
  ctx.fillStyle = '#181412';
  const rings = [[36, 72], [110, 146], [184, 220], [258, 294], [332, 368], [404, 438], [456, 512]];
  rings.forEach(([y0, y1]) => ctx.fillRect(0, y0, 64, y1 - y0));

  const tailTex = new THREE.CanvasTexture(c);
  tailTex.colorSpace = THREE.SRGBColorSpace;
  const tailMat = new THREE.MeshStandardMaterial({ map: tailTex, roughness: 0.66, metalness: 0.03 });

  const tubeGeo = new THREE.TubeGeometry(curve, 36, 0.060, 12, false);
  const tailMesh = new THREE.Mesh(tubeGeo, tailMat);
  tailMesh.castShadow = true;
  tail.add(tailMesh);

  sphere(tail, 0.060, 0.064, 0.060, tigerBlackMat, 0, -0.23, 0.95);
  return tailMat;
}

function makeTree(x, z, scale = 1, species = 0, isOuter = false) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(scale);
  scene.add(g);

  const castShad = !isOuter;

  if (species === 0) {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.28, 2.7, 8), barkMat);
    trunk.position.y = 1.35;
    trunk.castShadow = castShad;
    g.add(trunk);

    for (let b of [-1, 1]) {
      const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, 1.0, 6), barkMat);
      branch.position.set(b * 0.32, 2.25, 0);
      branch.rotation.z = b * -0.55;
      g.add(branch);
    }

    const energyVein = new THREE.Mesh(new THREE.BoxGeometry(0.035, 1.6, 0.04), softCyanMat);
    energyVein.position.set(x < 0 ? 0.16 : -0.16, 1.15, 0.12);
    g.add(energyVein);

    const pads = [
      [0, 2.85, 0, 1.15, 0.65, 1.1, foliageRichMat],
      [-0.55, 2.55, 0.2, 0.82, 0.52, 0.85, foliageMidMat],
      [0.58, 2.62, -0.15, 0.85, 0.54, 0.82, foliageBrightMat],
      [0, 3.32, 0.1, 0.82, 0.50, 0.80, foliageBrightMat]
    ];
    for (const [px, py, pz, sx, sy, sz, m] of pads) {
      const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 1), m);
      crown.scale.set(sx, sy, sz);
      crown.position.set(px, py, pz);
      crown.castShadow = castShad;
      g.add(crown);
    }
  } else if (species === 1) {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, 3.1, 8), darkBarkMat);
    trunk.position.y = 1.55;
    trunk.castShadow = castShad;
    g.add(trunk);

    for (let tier = 0; tier < 3; tier++) {
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(1.18 - tier * 0.24, 1.35 - tier * 0.12, 9),
        tier === 2 ? foliageBrightMat : (tier === 1 ? foliageMidMat : foliageRichMat)
      );
      cone.position.y = 2.05 + tier * 0.78;
      cone.castShadow = castShad;
      g.add(cone);
    }

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.022, 6, 14), softCyanMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.95;
    g.add(ring);
  } else {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.30, 2.4, 8), barkMat);
    trunk.position.y = 1.2;
    trunk.rotation.z = 0.06;
    trunk.castShadow = castShad;
    g.add(trunk);

    for (let i = 0; i < 3; i++) {
      const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(0.92 - i * 0.12, 1), i === 1 ? foliageBrightMat : foliageMidMat);
      canopy.scale.set(1.2, 0.68, 1.1);
      canopy.position.set((i - 1) * 0.45, 2.35 + (i % 2) * 0.32, (i - 1) * 0.15);
      canopy.castShadow = castShad;
      g.add(canopy);
    }

    const ruin = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.62, 0.32), ruinStoneMat);
    ruin.position.set(0.38, 0.31, 0.22);
    ruin.rotation.y = 0.3;
    g.add(ruin);
  }

  for (let f = 0; f < 3; f++) {
    const angle = (f / 3) * Math.PI * 2 + 0.4;
    const shrub = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 0), foliageMidMat);
    shrub.scale.set(1.2, 0.65, 1.1);
    shrub.position.set(Math.cos(angle) * 0.48, 0.16, Math.sin(angle) * 0.48);
    g.add(shrub);
  }

  const bio = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.13, 0),
    species % 2 === 0 ? cyanGlowMat : blossomGlowMat
  );
  bio.position.set(x < 0 ? 0.42 : -0.42, 0.24, 0.28);
  g.add(bio);

  trees.push(g);
}

function getLocalDateKey(dateObj = new Date()) {

function getYesterdayLocalDateKey() {

function loadPlayerData() {
  const base = defaultPlayerData();
  if (typeof window === 'undefined' || !window.localStorage) return base;

  let parsed = null;
  let hasValidPrimarySave = false;

  // Read the main save independently so a malformed JSON file cannot skip
  // legacy coin recovery or prevent the rest of the game from loading.
  try {
    const raw = window.localStorage.getItem(PLAYER_DATA_KEY);
    if (raw) {
      try {
        parsed = JSON.parse(raw);
        hasValidPrimarySave = !!parsed && typeof parsed === 'object' && !Array.isArray(parsed);
      } catch (parseError) {
        // Preserve the damaged payload for manual recovery before any migration.
        try {
          const backupKey = PLAYER_DATA_KEY + '_corrupt_backup';
          if (!window.localStorage.getItem(backupKey)) {
            window.localStorage.setItem(backupKey, raw);
          }
        } catch (backupError) {
          // Storage may be full or unavailable; continue with in-memory recovery.
        }
      }
    }
  } catch (storageReadError) {
    return base;
  }

  if (hasValidPrimarySave) {
    if (Number.isSafeInteger(parsed.totalEnergyCoin) && parsed.totalEnergyCoin >= 0) {
      base.totalEnergyCoin = parsed.totalEnergyCoin;
    }
    base.legacyMigrated = parsed.legacyMigrated === true;

    if (parsed.skillUpgrades && typeof parsed.skillUpgrades === 'object') {
      for (const key of ['magnet', 'rocket', 'x2']) {
        const value = parsed.skillUpgrades[key];
        if (Number.isFinite(value) && value >= 0) {
          base.skillUpgrades[key] = Math.max(0, Math.min(SKILL_MAX_LEVEL, Math.floor(value)));
        }
      }
    }
    if (Array.isArray(parsed.ownedDecorations)) {
      base.ownedDecorations = [...new Set(parsed.ownedDecorations.filter(v => typeof v === 'string'))];
      if (!base.ownedDecorations.includes('default_collar')) base.ownedDecorations.unshift('default_collar');
    }
    if (parsed.equippedDecorations && typeof parsed.equippedDecorations === 'object' && !Array.isArray(parsed.equippedDecorations)) {
      base.equippedDecorations = { ...base.equippedDecorations, ...parsed.equippedDecorations };
    }
    if (Number.isSafeInteger(parsed.phoenixCoreInventory) && parsed.phoenixCoreInventory >= 0) {
      base.phoenixCoreInventory = parsed.phoenixCoreInventory;
    }
    if (parsed.dailyReward && typeof parsed.dailyReward === 'object') {
      base.dailyReward = {
        lastClaimDate: typeof parsed.dailyReward.lastClaimDate === 'string' ? parsed.dailyReward.lastClaimDate : null,
        streakDay: Number.isFinite(parsed.dailyReward.streakDay)
          ? Math.max(1, Math.min(7, Math.floor(parsed.dailyReward.streakDay)))
          : 1
      };
    }
    if (parsed.missions && typeof parsed.missions === 'object') {
      base.missions = {
        dailyDate: typeof parsed.missions.dailyDate === 'string' ? parsed.missions.dailyDate : null,
        progress: (parsed.missions.progress && typeof parsed.missions.progress === 'object' && !Array.isArray(parsed.missions.progress))
          ? { ...parsed.missions.progress } : {},
        claimedIds: Array.isArray(parsed.missions.claimedIds)
          ? [...new Set(parsed.missions.claimedIds.filter(v => typeof v === 'string'))] : []
      };
    }
    if (parsed.stats && typeof parsed.stats === 'object') {
      const stats = parsed.stats;
      base.stats = {
        totalRuns: Number.isSafeInteger(stats.totalRuns) && stats.totalRuns >= 0 ? stats.totalRuns : 0,
        totalEvolutionActivations: Number.isSafeInteger(stats.totalEvolutionActivations) && stats.totalEvolutionActivations >= 0 ? stats.totalEvolutionActivations : 0,
        bestScore: Number.isFinite(stats.bestScore) && stats.bestScore >= 0 ? stats.bestScore : 0,
        lifetimeGameplayCoins: Number.isSafeInteger(stats.lifetimeGameplayCoins) && stats.lifetimeGameplayCoins >= 0
          ? stats.lifetimeGameplayCoins : base.totalEnergyCoin
      };
    } else {
      base.stats.lifetimeGameplayCoins = base.totalEnergyCoin;
    }
  }

  // Recover the legacy balance even when the primary save is absent or damaged.
  if (!base.legacyMigrated) {
    try {
      const legacyRaw = window.localStorage.getItem(LEGACY_ENERGY_KEY);
      const legacyVal = legacyRaw !== null ? Number(legacyRaw) : 0;
      if (Number.isSafeInteger(legacyVal) && legacyVal > 0) {
        base.totalEnergyCoin = Math.max(base.totalEnergyCoin, legacyVal);
        base.stats.lifetimeGameplayCoins = Math.max(base.stats.lifetimeGameplayCoins, base.totalEnergyCoin);
      }
      base.legacyMigrated = true;
      window.localStorage.setItem(PLAYER_DATA_KEY, JSON.stringify(base));
      window.localStorage.setItem(LEGACY_ENERGY_KEY, String(base.totalEnergyCoin));
    } catch (migrationError) {
      // Keep recovered data in memory; a later successful save can persist it.
    }
  }

  return base;
}

function syncDailyMissionsAndStreakState() {
  const todayKey = getLocalDateKey();
  const yesterdayKey = getYesterdayLocalDateKey();
  let dirty = false;

  if (playerData.missions.dailyDate !== todayKey) {
    playerData.missions.dailyDate = todayKey;
    for (const m of MISSIONS_CATALOG) {
      if (m.category === 'DAILY') {
        playerData.missions.progress[m.id] = 0;
        const idx = playerData.missions.claimedIds.indexOf(m.id);
        if (idx !== -1) playerData.missions.claimedIds.splice(idx, 1);
      }
    }
    dirty = true;
  }

  const lastClaim = playerData.dailyReward.lastClaimDate;
  if (lastClaim && lastClaim !== todayKey && lastClaim !== yesterdayKey) {
    if (playerData.dailyReward.streakDay !== 1) {
      playerData.dailyReward.streakDay = 1;
      dirty = true;
    }
  }

  const lifeCoins = Math.max(0, Math.floor(playerData.stats.lifetimeGameplayCoins || 0));
  const prevAch = playerData.missions.progress.ach_lifetime_coins_500 || 0;
  if (lifeCoins > prevAch) {
    playerData.missions.progress.ach_lifetime_coins_500 = Math.min(500, lifeCoins);
    dirty = true;
  }

  if (dirty) savePlayerData();
  updateMissionsNavBadge();
}

function canClaimDailyCapsuleToday() {
  const todayKey = getLocalDateKey();
  return playerData.dailyReward.lastClaimDate !== todayKey;
}

function getMissionProgressValue(missionId) {
  const m = MISSIONS_CATALOG.find(item => item.id === missionId);
  if (!m) return 0;
  const raw = Number(playerData.missions.progress[missionId] || 0);
  return Math.max(0, Math.min(m.target, Math.floor(raw)));
}

function isMissionClaimed(missionId) {
  return playerData.missions.claimedIds.includes(missionId);
}

function incrementMissionProgress(missionId, amount = 1) {
  const m = MISSIONS_CATALOG.find(item => item.id === missionId);
  if (!m) return;
  const current = getMissionProgressValue(missionId);
  if (current >= m.target) return;
  playerData.missions.progress[missionId] = Math.min(m.target, current + amount);
}

function updateMissionMaxProgress(missionId, value) {
  const m = MISSIONS_CATALOG.find(item => item.id === missionId);
  if (!m) return;
  const current = getMissionProgressValue(missionId);
  if (value > current) {
    playerData.missions.progress[missionId] = Math.min(m.target, Math.floor(value));
  }
}

function hasAnyUnclaimedReward() {
  if (canClaimDailyCapsuleToday()) return true;
  for (const m of MISSIONS_CATALOG) {
    if (getMissionProgressValue(m.id) >= m.target && !isMissionClaimed(m.id)) {
      return true;
    }
  }
  return false;
}

function updateMissionsNavBadge() {
  const dot = document.querySelector('#missionsBadgeDot');
  if (!dot) return;
  dot.style.display = hasAnyUnclaimedReward() ? 'block' : 'none';

function getATUKMAODesiredBGM() {

function unlockATUKMAOBGM() {

function updateATUKMAOBGM(now, force = false) {
  if (!userSettings.backgroundMusic) {
    Object.values(atukmaoBGM).forEach(audio => {
      audio.volume = 0;
      if (!audio.paused) audio.pause();
    });
    atukmaoBGMCurrent = null;
    atukmaoBGMNext = null;
    return;
  }
  const desired = getATUKMAODesiredBGM();
  if (!atukmaoBGMUnlocked) return;
  if (desired === atukmaoBGMCurrent && atukmaoBGMNext) {
    atukmaoBGM[atukmaoBGMNext].pause();
    atukmaoBGM[atukmaoBGMNext].currentTime = 0;
    atukmaoBGM[atukmaoBGMNext].volume = 0;
    atukmaoBGMNext = null;
    atukmaoBGM[atukmaoBGMCurrent].volume = 0.34;
  } else if (desired !== atukmaoBGMCurrent && desired !== atukmaoBGMNext) {
    if (atukmaoBGMNext) {
      atukmaoBGM[atukmaoBGMNext].pause();
      atukmaoBGM[atukmaoBGMNext].currentTime = 0;
      atukmaoBGM[atukmaoBGMNext].volume = 0;
    }
    atukmaoBGMNext = desired;
    atukmaoBGMFadeStarted = now;
    const nextAudio = atukmaoBGM[desired];
    nextAudio.volume = 0;
    if (nextAudio.paused) {
      const playPromise = nextAudio.play();
      if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
    }
  }
  if (atukmaoBGMNext) {
    const t = force ? 1 : Math.min(1, Math.max(0, (now - atukmaoBGMFadeStarted) / ATUKMAO_BGM_FADE_MS));
    const incoming = atukmaoBGM[atukmaoBGMNext];
    incoming.volume = 0.34 * t;
    if (atukmaoBGMCurrent) {
      const outgoing = atukmaoBGM[atukmaoBGMCurrent];
      outgoing.volume = 0.34 * (1 - t);
    }
    if (t >= 1) {
      if (atukmaoBGMCurrent) {
        const outgoing = atukmaoBGM[atukmaoBGMCurrent];
        outgoing.pause();
        outgoing.currentTime = 0;
        outgoing.volume = 0;
      }
      atukmaoBGMCurrent = atukmaoBGMNext;
      atukmaoBGMNext = null;
    }
  } else if (atukmaoBGMCurrent && atukmaoBGM[atukmaoBGMCurrent].paused) {
    const playPromise = atukmaoBGM[atukmaoBGMCurrent].play();
    if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
  }
}

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

function updateEvolutionVisuals(simTime, blend) {
  if (blend <= 0.001) {
    restoreOriginalTigerMaterials();
    return;
  }

  evoGroup.visible = true;
  const cycle = simTime * 0.65;
  const hCyan = 0.48 + 0.05 * Math.sin(cycle * Math.PI * 2);
  const hBlue = 0.58 + 0.05 * Math.sin(cycle * Math.PI * 2 + 1.2);
  const hViolet = 0.78 + 0.06 * Math.sin(cycle * Math.PI * 2 + 2.4);
  const hGold = 0.12 + 0.03 * Math.sin(cycle * Math.PI * 2 + 3.6);

  cTemp1.setHSL(hCyan, 0.85, 0.88);
  tigerBodyMat.color.copy(cWhite).lerp(cTemp1, blend * 0.35);
  cTemp2.setHSL(hCyan, 0.95, 0.50);
  tigerBodyMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  tigerBodyMat.emissiveIntensity = 0.26 * blend;

  tigerChestMat.color.copy(cWhite).lerp(cTemp1, blend * 0.35);
  tigerChestMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  tigerChestMat.emissiveIntensity = 0.26 * blend;

  cTemp1.setHSL(hBlue, 0.85, 0.90);
  tigerFaceMat.color.copy(cWhite).lerp(cTemp1, blend * 0.30);
  tigerFaceMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  tigerFaceMat.emissiveIntensity = 0.22 * blend;

  cTemp1.setHSL(hViolet, 0.80, 0.86);
  tigerFurMat.color.copy(cFurOrig).lerp(cTemp1, blend * 0.40);
  cTemp2.setHSL(hViolet, 0.90, 0.48);
  tigerFurMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  tigerFurMat.emissiveIntensity = 0.30 * blend;

  tigerBellyMat.color.copy(cWhite).lerp(cTemp1, blend * 0.32);
  tigerBellyMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  tigerBellyMat.emissiveIntensity = 0.24 * blend;

  tigerTailMat.color.copy(cWhite).lerp(cTemp1, blend * 0.36);
  tigerTailMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  tigerTailMat.emissiveIntensity = 0.26 * blend;

  cTemp1.setHSL(hGold, 1.0, 0.62);
  goldAccentMat.emissive.copy(cBlack).lerp(cTemp1, blend);
  goldAccentMat.emissiveIntensity = 1.15 * blend;

  cTemp2.setHSL(hCyan, 1.0, 0.60);
  collarBandMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  collarBandMat.emissiveIntensity = 0.80 * blend;

  silverWireMat.emissive.copy(cBlack).lerp(cTemp2, blend);
  silverWireMat.emissiveIntensity = 0.85 * blend;

  necklaceGlowMat.emissive.copy(cNecklaceOrigEmissive).lerp(cTemp1, blend * 0.6);
  necklaceGlowMat.emissiveIntensity = 1.9 + 1.1 * blend;
  necklacePendantMat.emissive.copy(cPendantOrigEmissive).lerp(cTemp1, blend * 0.6);
  necklacePendantMat.emissiveIntensity = 2.2 + 1.2 * blend;
  necklaceLight.color.copy(cTemp2);
  necklaceLight.intensity = 0.65 + 0.65 * blend;

  eyeIrisMat.emissive.setHSL(hCyan, 1.0, 0.62);
  eyeIrisMat.emissiveIntensity = 0.65 + 1.55 * blend;

  evoAuraMat1.color.setHSL(hCyan, 1.0, 0.58);
  evoAuraMat1.opacity = 0.48 * blend;
  evoAuraMat2.color.setHSL(hViolet, 1.0, 0.62);
  evoAuraMat2.opacity = 0.38 * blend;

  evoRing1.rotation.z = simTime * 2.2;
  evoRing2.rotation.z = -simTime * 1.8;
  const ringPulse = 1 + Math.sin(simTime * 7) * 0.06;
  evoRing1.scale.setScalar(ringPulse);
  evoRing2.scale.setScalar(2.0 - ringPulse);

  evoLight.color.setHSL(hCyan, 1.0, 0.62);
  evoLight.intensity = 1.65 * blend;

  evoOrbitParticles.forEach((p, idx) => {
    const a = p.phase + simTime * 3.1;
    const side = idx % 2 === 0 ? -1 : 1;
    p.mesh.position.set(
      side * (0.68 + 0.14 * Math.sin(a)),
      0.28 + (idx % 3) * 0.16 + 0.06 * Math.cos(a * 1.5),
      -0.45 + idx * 0.24
    );
    p.mesh.rotation.y = a;
    p.mesh.scale.setScalar(blend);
    p.mat.color.setHSL((cycle + idx * 0.15) % 1.0, 1.0, 0.64);
  });

function isLaneClearAtZ(ln, zTarget, minDist) {
  for (const it of items) {
    if (it.lane === ln && Math.abs(it.g.position.z - zTarget) < minDist) return false;
  }
  return true;
}

function spawnSafeOrb(ln, zPos, yPos = 0.95) {
  for (const it of items) {
    if (it.lane === ln) {
      const dz = Math.abs(it.g.position.z - zPos);
      if (it.type !== 'orb' && dz < 1.35) {
        if (it.type === 'low' && yPos > 1.45) continue;
        if ((it.type === 'high' || it.type === 'gate') && yPos < 0.65) continue;
        return;
      }
      if (it.type === 'orb' && dz < 1.1) return;
    }
  }
  makeItem('orb', ln, zPos, yPos);
}

function countActiveSkillItemsInWorld() {
  let count = 0;
  for (const it of items) {
    if (isSkillType(it.type) && !it.hit) count++;
  }
  return count;
}

function isSpaceClearForSkill(ln, zTarget) {
  for (const it of items) {
    if (it.lane === ln && Math.abs(it.g.position.z - zTarget) < 4.5) return false;
  }
  return true;
}

function trySpawnRandomSkillCollectible() {
  if (activePlayTime < SKILL_SPAWN_GRACE_SECONDS) return;
  if (countActiveSkillItemsInWorld() >= MAX_ACTIVE_WORLD_SKILLS) return;

  const allLanes = [-1, 0, 1];
  const preferredLanes = allLanes.filter(l => l !== lastSkillLane);
  const candidatePool = preferredLanes.length ? preferredLanes : allLanes;
  const shuffledLanes = [...candidatePool].sort(() => Math.random() - 0.5);

  const zSpawn = -67.5;
  let chosenLane = null;
  for (const ln of shuffledLanes) {
    if (isSpaceClearForSkill(ln, zSpawn)) {
      chosenLane = ln;
      break;
    }
  }
  if (chosenLane === null) return;

  lastSkillLane = chosenLane;
  const skillTypes = ['skill_magnet', 'skill_rocket', 'skill_x2'];
  const pickedType = skillTypes[Math.floor(Math.random() * skillTypes.length)];
  makeItem(pickedType, chosenLane, zSpawn);
}

function spawnCoordinatedWave() {
  const allLanes = [-1, 0, 1];
  const candidateLanes = allLanes.filter(l => l !== lastSpawnLane && isLaneClearAtZ(l, -74, 12));
  const primaryLane = candidateLanes.length
    ? candidateLanes[Math.floor(Math.random() * candidateLanes.length)]
    : allLanes[Math.floor(Math.random() * 3)];
  lastSpawnLane = primaryLane;

  const primaryType = Math.random() < 0.5 ? 'low' : (Math.random() < 0.5 ? 'high' : 'gate');
  makeItem(primaryType, primaryLane, -74);

  let secondLane = null;
  let secondType = null;
  if (activePlayTime > 20 && Math.random() < 0.34) {
    const secondCandidates = allLanes.filter(l => l !== primaryLane && isLaneClearAtZ(l, -74, 14));
    if (secondCandidates.length >= 2) {
      secondLane = secondCandidates[Math.floor(Math.random() * secondCandidates.length)];
      secondType = Math.random() < 0.5 ? 'low' : 'gate';
      makeItem(secondType, secondLane, -74);
    }
  }

  const safeLanes = allLanes.filter(l => l !== primaryLane && l !== secondLane);
  const safeLane = safeLanes[Math.floor(Math.random() * safeLanes.length)];

  const roll = Math.random();
  let pattern = 'A';
  if (activePlayTime < 18) {
    if (roll < 0.38) pattern = 'A';
    else if (roll < 0.68) pattern = 'B';
    else pattern = (primaryType === 'low') ? 'C' : 'D';
  } else if (activePlayTime < 65) {
    if (roll < 0.18) pattern = 'A';
    else if (roll < 0.42) pattern = 'B';
    else if (roll < 0.66) pattern = (primaryType === 'low') ? 'C' : 'D';
    else if (roll < 0.86) pattern = 'E';
    else pattern = 'F';
  } else {
    if (roll < 0.12) pattern = 'A';
    else if (roll < 0.34) pattern = 'B';
    else if (roll < 0.56) pattern = (primaryType === 'low') ? 'C' : 'D';
    else if (roll < 0.80) pattern = 'E';
    else pattern = 'F';
  }

  if (pattern === 'A') {
    const count = 1 + Math.floor(Math.random() * 5);
    const spacing = 2.4;
    for (let i = 0; i < count; i++) {
      spawnSafeOrb(safeLane, -66 - i * spacing, 0.95);
    }
  } else if (pattern === 'B') {
    const startLane = primaryLane;
    const midLane = (startLane !== 0 && safeLane !== 0) ? 0 : safeLane;
    const seq = [startLane, startLane, midLane, safeLane, safeLane];
    for (let i = 0; i < seq.length; i++) {
      spawnSafeOrb(seq[i], -62 - i * 2.5, 0.95);
    }
  } else if (pattern === 'C') {
    const heights = [0.95, 1.52, 1.92, 1.52, 0.95];
    const zOffsets = [-68.8, -71.4, -74.0, -76.6, -79.2];
    for (let i = 0; i < heights.length; i++) {
      spawnSafeOrb(primaryLane, zOffsets[i], heights[i]);
    }
  } else if (pattern === 'D') {
    const zOffsets = [-69.0, -71.5, -74.0, -76.5, -79.0];
    for (let i = 0; i < zOffsets.length; i++) {
      spawnSafeOrb(primaryLane, zOffsets[i], 0.46);
    }
  } else if (pattern === 'E') {
    for (let i = 0; i < 2; i++) {
      spawnSafeOrb(safeLane, -71.5 - i * 2.8, 0.95);
    }
    const actionY = (primaryType === 'low') ? 1.88 : 0.46;
    const zRisk = [-67.5, -70.0, -72.0, -74.0, -76.0, -78.5];
    for (let i = 0; i < zRisk.length; i++) {
      const y = (i >= 2 && i <= 3) ? actionY : 0.95;
      spawnSafeOrb(primaryLane, zRisk[i], y);
    }
  } else if (pattern === 'F') {
    const actionY = (primaryType === 'low') ? 1.88 : 0.46;
    spawnSafeOrb(primaryLane, -68.5, 0.95);
    spawnSafeOrb(primaryLane, -71.2, actionY);
    spawnSafeOrb(primaryLane, -74.0, actionY);
    spawnSafeOrb(primaryLane, -76.8, 0.95);
    const midLane = (primaryLane !== 0 && safeLane !== 0) ? 0 : safeLane;
    spawnSafeOrb(midLane, -79.8, 0.95);
    spawnSafeOrb(safeLane, -82.6, 0.95);
    spawnSafeOrb(safeLane, -85.2, 0.95);
  }
}

function normalizeAnglePi(a) {
  const twoPi = Math.PI * 2;
  let r = ((a % twoPi) + twoPi) % twoPi;
  if (r > Math.PI) r -= twoPi;
  return r;
}

function reviveWithPhoenixCore() {
  if (revivalUsed || playerData.phoenixCoreInventory <= 0) {
    showFinalGameOverOverlay();
    return;
  }

  playerData.phoenixCoreInventory = Math.max(0, playerData.phoenixCoreInventory - 1);
  revivalUsed = true;
  awaitingRevivalDecision = false;
  savePlayerData();
  updateCoinHUD();

  evoProgress = 0;
  evoState = EVO_STATE_NORMAL;
  evoTimeLeft = 0;
  evoVisualBlend = 0;
  restoreOriginalTigerMaterials();
  updateEvolutionShieldHUD();

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.type !== 'orb' && !isSkillType(it.type)) {
      if (Math.abs(it.g.position.z - tiger.position.z) < 12.0) {
        it.hit = true;
        scene.remove(it.g);
        items.splice(i, 1);
      }
    }
  }

  jump = 0;
  slide = 0;
  rollBlend = 0;
  rollAngle = 0;
  tiger.position.y = 0.25;
  tigerRollPivot.rotation.set(0, 0, 0);
  tigerRollPivot.scale.set(1, 1, 1);
  revivalProtectionTimer = REVIVAL_PROTECTION_DURATION;

  spawnPickupBurst(tiger.position.x, tiger.position.y + 0.85, tiger.position.z, 0xffae00);
  spawnPickupBurst(tiger.position.x, tiger.position.y + 0.95, tiger.position.z - 0.2, 0x4df7d4);

  overlay.style.display = 'none';
  ended = false;
  running = true;
  paused = true;
  beginResumeCountdown();
}

function end() {
  playATUKMAOSound('death');
  triggerATUKMAOVibration('death');
  clearPauseAndCountdownOverlays();
  rocketPlumes.forEach(p => { p.group.visible = false; });
  rocketDashShield.visible = false;
  magnetFieldRing.visible = false;

function isGameplayInputAllowed() {
  return sceneState === SCENE_RUNNING && running && !paused && !ended && resumeCountdown <= 0;
}

function isLobbyTigerRotateAllowed() {
  return sceneState === SCENE_LOBBY &&
         lobbyModal.style.display !== 'flex' &&
         settingsModal.style.display !== 'flex';
}

// Rotate ONLY whiteTigerRoot.rotation.y when dragging inside the central showcase area
function isInsideTigerShowcaseZone(clientX, clientY) {
  const xNorm = clientX / Math.max(1, innerWidth);
  const yNorm = clientY / Math.max(1, innerHeight);
  return xNorm >= 0.12 && xNorm <= 0.88 && yNorm >= 0.14 && yNorm <= 0.72;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (!isLobbyTigerRotateAllowed()) return;
  if (!isInsideTigerShowcaseZone(e.clientX, e.clientY)) return;
  isTigerDragging = true;
  tigerDragPointerId = e.pointerId;
  tigerDragLastX = e.clientX;
  try {
    renderer.domElement.setPointerCapture(e.pointerId);
  } catch (err) {
    // Ignore pointer capture errors
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!isTigerDragging || e.pointerId !== tigerDragPointerId) return;
  if (!isLobbyTigerRotateAllowed()) {
    isTigerDragging = false;
    tigerDragPointerId = null;
    return;
  }
  const dx = e.clientX - tigerDragLastX;
  tigerDragLastX = e.clientX;
  // Rotate ONLY the tiger character root group around its vertical centre axis
  whiteTigerRoot.rotation.y += dx * 0.012;
});

function stopTigerDrag(e) {
  if (!isTigerDragging || e.pointerId !== tigerDragPointerId) return;
  isTigerDragging = false;
  tigerDragPointerId = null;
  try {
    renderer.domElement.releasePointerCapture(e.pointerId);
  } catch (err) {
    // Ignore pointer capture errors
  }
}
renderer.domElement.addEventListener('pointerup', stopTigerDrag);
renderer.domElement.addEventListener('pointercancel', stopTigerDrag);

function move(d) {
  if (!isGameplayInputAllowed()) return;
  const nextLane = Math.max(-1, Math.min(1, lane + d));
  if (nextLane !== lane) {
    lane = nextLane;
    targetLaneX = lane * 2.15;
    tiger.position.x += (targetLaneX - tiger.position.x) * 0.18;
  }
}

function doJump() {
  if (!isGameplayInputAllowed()) return;
  if (jump <= 0) {
    slide = 0;
    jump = JUMP_DURATION;
    playATUKMAOSound('jump');
  }
}

function doSlide() {
  if (!isGameplayInputAllowed()) return;
  if (jump > 0) jump = 0;
  slide = SLIDE_DURATION;
  playATUKMAOSound('roll');
}

    const isMax = currentLv >= SKILL_MAX_LEVEL;
    const curDur = getSkillDurationSeconds(currentLv);
    const nextDur = getSkillDurationSeconds(currentLv + 1);
    const cost = getSkillUpgradeCost(skillKey, currentLv);
    const canAfford = playerData.totalEnergyCoin >= cost;

    let segs = '';
    for (let i = 1; i <= SKILL_MAX_LEVEL; i++) {
      segs += `<div class="shop-lvl-seg ${i <= currentLv ? 'filled' : ''}"></div>`;
    }

    let btnHtml = '';
    if (isMax) {
      btnHtml = `<button class="shop-buy-btn maxed" type="button" disabled>✓ MAX</button>`;
    } else {
      btnHtml = `
        <button class="shop-buy-btn ${canAfford ? '' : 'insufficient'}" type="button" data-upgrade-skill="${skillKey}">
          <span>UPGRADE</span>
          <span>⚡ ${cost}</span>
        </button>`;
    }

    return `

        <div class="shop-card-top">
          <div class="shop-ico ${skillKey}">${cfg.icon}</div>
          <div class="shop-info">
            <div class="shop-name-row">
              <span class="shop-name">${cfg.name}</span>
              <span class="shop-lvl-badge ${isMax ? 'max' : ''}">${isMax ? 'LV. 10 MAX' : `LV. ${currentLv} / 10`}</span>
            </div>
            <div class="shop-desc">${cfg.desc}</div>
          </div>
        </div>
        <div class="shop-lvl-bars">${segs}</div>
        <div class="shop-card-foot">
          <div class="shop-dur-info">
            Tempoh: <span>${curDur}s</span>
            ${isMax ? '<span class="shop-dur-next"> &nbsp;(MAKSIMUM)</span>' : ` &rarr; <span class="shop-dur-next">${nextDur}s</span>`}
          </div>
          ${btnHtml}
        </div>
      </div>`;
  }).join('');

  modalBody.innerHTML = `
    <div class="shop-header-bar">
      <span class="shop-header-label">BAKI ENERGY COIN</span>
      <span class="shop-header-coin">⚡ <span id="shopModalCoinVal">${playerData.totalEnergyCoin}</span></span>
    </div>
    <div class="shop-notice" id="shopNoticeMsg">${noticeText}</div>

}

function handleSkillUpgradePurchase(skillKey) {
  if (!SKILL_CONFIG[skillKey]) return;
  const currentLv = Math.max(0, Math.min(SKILL_MAX_LEVEL, Math.floor(playerData.skillUpgrades[skillKey] || 0)));
  if (currentLv >= SKILL_MAX_LEVEL) {
    renderShopModalContent('Tahap kemahiran telah mencapai maksimum (MAX)!');
    return;
  }
  const cost = getSkillUpgradeCost(skillKey, currentLv);
  if (playerData.totalEnergyCoin < cost) {
    renderShopModalContent('NOT ENOUGH COINS');
    return;
  }

  playerData.totalEnergyCoin -= cost;
  playerData.skillUpgrades[skillKey] = currentLv + 1;
  savePlayerData();
  updateCoinHUD();
  renderShopModalContent('');
  const noticeEl = document.querySelector('#shopNoticeMsg');
  if (noticeEl) {
    noticeEl.style.color = '#4df7d4';
    noticeEl.textContent = `${SKILL_CONFIG[skillKey].name} dinaik taraf ke LV. ${currentLv + 1} (${getSkillDurationSeconds(currentLv + 1)}s)!`;
  }
}

function handleClaimDailyCapsule() {
  syncDailyMissionsAndStreakState();
  if (!canClaimDailyCapsuleToday()) {
    renderMissionsModalContent('Daily Energy Capsule telah dituntut hari ini.');
    return;
  }

  const todayKey = getLocalDateKey();
  const yesterdayKey = getYesterdayLocalDateKey();
  const lastClaim = playerData.dailyReward.lastClaimDate;

  let claimDay = playerData.dailyReward.streakDay || 1;
  if (lastClaim === yesterdayKey) {
    claimDay = Math.max(1, Math.min(7, claimDay));
  } else if (lastClaim && lastClaim !== todayKey) {
    claimDay = 1;
  }

  const reward = DAILY_CAPSULE_SCHEDULE[claimDay - 1] || DAILY_CAPSULE_SCHEDULE[0];
  if (reward.coins > 0) playerData.totalEnergyCoin += reward.coins;
  if (reward.cores > 0) playerData.phoenixCoreInventory += reward.cores;

  playerData.dailyReward.lastClaimDate = todayKey;
  playerData.dailyReward.streakDay = (claimDay >= 7) ? 1 : (claimDay + 1);

  savePlayerData();
  updateCoinHUD();
  updateMissionsNavBadge();
  renderMissionsModalContent(`Daily Capsule Hari ${claimDay} dituntut: ${reward.label}!`);
}

function handleClaimMissionReward(missionId) {
  syncDailyMissionsAndStreakState();
  const m = MISSIONS_CATALOG.find(item => item.id === missionId);
  if (!m) return;
  if (isMissionClaimed(missionId)) return;
  const prog = getMissionProgressValue(missionId);
  if (prog < m.target) return;

  playerData.missions.claimedIds.push(missionId);
  if (m.rewardCoins > 0) playerData.totalEnergyCoin += m.rewardCoins;
  if (m.rewardCores > 0) playerData.phoenixCoreInventory += m.rewardCores;

  savePlayerData();
  updateCoinHUD();
  updateMissionsNavBadge();
  renderMissionsModalContent(`Ganjaran dituntut: ${m.rewardLabel}!`);
}

let touchX = 0, touchY = 0, swipeCommitted = false, activeSwipeTouchId = null;
const SWIPE_TRIGGER_PX = 16;

function getTrackedTouch(touchList) {
  for (let i = 0; i < touchList.length; i++) {
    if (touchList[i].identifier === activeSwipeTouchId) return touchList[i];
  }
  return null;
}

function commitSwipe(dx, dy) {
  if (swipeCommitted || Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_TRIGGER_PX) return;
  swipeCommitted = true;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
  else if (dy < 0) doJump();
  else doSlide();
}

renderer.domElement.addEventListener('touchstart', e => {
  if (!isGameplayInputAllowed() || activeSwipeTouchId !== null || e.changedTouches.length === 0) return;
  const t = e.changedTouches[0];
  activeSwipeTouchId = t.identifier;
  touchX = t.clientX;
  touchY = t.clientY;
  swipeCommitted = false;
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  if (swipeCommitted || !isGameplayInputAllowed() || activeSwipeTouchId === null) return;
  const t = getTrackedTouch(e.touches);
  if (!t) return;
  commitSwipe(t.clientX - touchX, t.clientY - touchY);
}, { passive: true });

renderer.domElement.addEventListener('touchend', e => {
  if (activeSwipeTouchId === null) return;
  const t = getTrackedTouch(e.changedTouches);
  if (t && isGameplayInputAllowed()) {
    commitSwipe(t.clientX - touchX, t.clientY - touchY);
  }
  if (t) activeSwipeTouchId = null;
}, { passive: true });

renderer.domElement.addEventListener('touchcancel', e => {
  if (activeSwipeTouchId !== null && getTrackedTouch(e.changedTouches)) {
    activeSwipeTouchId = null;
    swipeCommitted = false;
  }
}, { passive: true });

addEventListener('keydown', e => {
  // Preserve native typing and focused-control behavior; game shortcuts should
  // never hijack text entry or activate while a UI control has keyboard focus.
  const target = e.target;
  const isEditableTarget = target instanceof HTMLElement && (
    target.isContentEditable ||
    /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)
  );
  const isInteractiveTarget = target instanceof HTMLElement && (
    /^(BUTTON|A)$/.test(target.tagName) ||
    target.closest('button, a, [role="button"], input, textarea, select, [contenteditable="true"]')
  );
  if (isEditableTarget || isInteractiveTarget) return;

  const leftKey = e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A';
  const rightKey = e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D';
  const jumpKey = e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ';
  const slideKey = e.key === 'ArrowDown' || e.key === 's' || e.key === 'S';

  if (isGameplayInputAllowed() && (leftKey || rightKey || jumpKey || slideKey)) {
    // Stop arrow/space keys from scrolling the page while actively playing.
    e.preventDefault();
    if (leftKey) move(-1);
    else if (rightKey) move(1);
    else if (jumpKey) doJump();
    else if (slideKey) doSlide();
    return;
  }

  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (settingsModal.style.display === 'flex') {
      closeSharedSettings();
    } else if (sceneState === SCENE_RUNNING && running && !ended) {
      e.preventDefault();
      if (paused) beginResumeCountdown();
      else openPauseMenu();
    }
  }
});

// ============================================================================
// 18. MAIN ANIMATION LOOP
// ============================================================================
function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  updateATUKMAOBGM(now);

  if (paused) {
    last = now;
    renderer.render(scene, camera);
    return;
  }

  const dt = Math.min((now - last) / 1000, 0.04);
  last = now;

  // SCENE STATE 1: INTERACTIVE 3D LOBBY SHOWCASE (STATIONARY CAMERA & ENVIRONMENT)
  if (sceneState === SCENE_LOBBY) {
    animTime += dt;
    const breath = Math.sin(animTime * 2.2) * 0.012;
    tiger.position.set(0, 0.25 + breath, 2);
    head.position.y = 1.22 + Math.sin(animTime * 2.2 + 0.6) * 0.014;
    head.rotation.y = Math.sin(animTime * 0.85) * 0.08;
    tail.rotation.x = Math.sin(animTime * 1.8) * 0.06;
    tail.rotation.z = Math.sin(animTime * 2.2) * 0.14;

    // Subtle luminous necklace pulse
    const nPulse = 0.88 + 0.16 * Math.sin(animTime * 3.1);
    necklaceLight.intensity = 0.65 * nPulse;
    necklaceGlowMat.emissiveIntensity = 1.85 * nPulse;
    necklacePendantMat.emissiveIntensity = 2.15 * nPulse;

    // Camera & environment remain stationary while only whiteTigerRoot.rotation.y turns on drag
    camera.position.copy(LOBBY_CAM_POS);
    currentCamLook.copy(LOBBY_CAM_LOOK);
    camera.lookAt(currentCamLook);
    renderer.render(scene, camera);
    return;
  }

  // SCENE STATE 2: SMOOTH CAMERA TRANSITION FROM LOBBY TO RUN
  if (sceneState === SCENE_TRANSITION_TO_RUN) {
    camTransitionTime += dt;
    const t = Math.min(1, camTransitionTime / CAM_TRANSITION_DURATION);
    const e = easeInOutCubic(t);

    camera.position.lerpVectors(camStartPos, GAME_CAM_POS, e);
    currentCamLook.lerpVectors(camStartLook, GAME_CAM_LOOK, e);
    camera.lookAt(currentCamLook);

    // Smoothly align the rotated tiger back to 0 (-Z forward) before running begins
    whiteTigerRoot.rotation.y = transitionStartTigerRotY * (1 - e);

    animTime += dt;
    legs.forEach((l, i) => {
      l.rotation.x = Math.sin(animTime * 14 + (i % 2) * Math.PI + (i > 1 ? Math.PI * 0.5 : 0)) * 0.68 * e;
    });
    roadTex.offset.y -= 15 * e * dt * 0.06;

    if (t >= 1) {
      whiteTigerRoot.rotation.y = 0;
      sceneState = SCENE_RUNNING;
      lobbyUI.style.display = 'none';
      hudEl.style.display = 'block';
      running = true;
      playerData.stats.totalRuns = (playerData.stats.totalRuns || 0) + 1;
      savePlayerData();
    }
    renderer.render(scene, camera);
    return;
  }

  // SCENE STATE 3: SMOOTH CAMERA TRANSITION BACK TO LOBBY
  if (sceneState === SCENE_TRANSITION_TO_LOBBY) {
    camTransitionTime += dt;
    const t = Math.min(1, camTransitionTime / CAM_TRANSITION_DURATION);
    const e = easeInOutCubic(t);

    camera.position.lerpVectors(camStartPos, LOBBY_CAM_POS, e);
    currentCamLook.lerpVectors(camStartLook, LOBBY_CAM_LOOK, e);
    camera.lookAt(currentCamLook);

    if (t >= 1) {
      sceneState = SCENE_LOBBY;
      lobbyUI.style.display = 'flex';
      lobbyUI.style.opacity = '1';
      lobbyUI.style.pointerEvents = 'none';
      updateCoinHUD();
      updateMissionsNavBadge();
    }
    renderer.render(scene, camera);
    return;
  }

  // 3-SECOND RESUME COUNTDOWN (3 -> 2 -> 1 -> GO)
  if (resumeCountdown > 0) {
    resumeCountdown = Math.max(0, resumeCountdown - dt);
    if (resumeCountdown > 2.45) {
      countdownBadge.textContent = '3';
    } else if (resumeCountdown > 1.45) {
      countdownBadge.textContent = '2';
    } else if (resumeCountdown > 0.45) {
      countdownBadge.textContent = '1';
    } else if (resumeCountdown > 0) {
      countdownBadge.textContent = 'GO';
    } else {
      countdownBadge.style.opacity = '0';
      countdownBadge.style.display = 'none';
    }
    renderer.render(scene, camera);
    return;
  }

  if (running) {
    animTime += dt;
    activePlayTime += dt;

    // 1. Progressive Speed (+25% every 50s of active play)
    const targetStage = Math.floor(activePlayTime / SPEED_STAGE_INTERVAL);
    if (targetStage > speedStage) {
      speedStage = targetStage;
      windBurstTimer = 1.6;
    }
    baseSpeed = INITIAL_BASE_SPEED * Math.pow(SPEED_STAGE_MULTIPLIER, speedStage);

    // 2. Active Skill Timers & Rocket Speed / Post-Rocket Grace Period
    const wasRocketActive = activeSkillTimers.rocket > 0;
    for (const key of ['magnet', 'rocket', 'x2']) {
      if (activeSkillTimers[key] > 0) {
        activeSkillTimers[key] = Math.max(0, activeSkillTimers[key] - dt);
      }
    }
    const isRocketActive = activeSkillTimers.rocket > 0;
    if (wasRocketActive && !isRocketActive) {
      rocketGraceTimer = ROCKET_POST_GRACE_DURATION;
    }
    if (rocketGraceTimer > 0) {
      rocketGraceTimer = Math.max(0, rocketGraceTimer - dt);
    }
    if (revivalProtectionTimer > 0) {
      revivalProtectionTimer = Math.max(0, revivalProtectionTimer - dt);
    }
    updateActiveSkillsHUD();

    const rocketMult = isRocketActive ? ROCKET_SPEED_MULTIPLIER : 1.0;
    speed = Math.min(38, baseSpeed * WORLD_SPEED_SCALE * rocketMult);

    if (windBurstTimer > 0 || isRocketActive) {
      if (windBurstTimer > 0) windBurstTimer = Math.max(0, windBurstTimer - dt);
      windMat.opacity = isRocketActive ? 0.55 : Math.sin((windBurstTimer / 1.6) * Math.PI) * 0.42;
      for (const w of windStreaks) {
        w.position.z += speed * dt * 2.2;
        if (w.position.z > 12) w.position.z -= 75;
      }
    } else {
      windMat.opacity = 0;
    }

    score += dt * speed * 0.65;
    spawn -= dt;
    skillSpawnTimer -= dt;

    // 3. Evolution Active Countdown
    if (evoState === EVO_STATE_ACTIVE) {
      evoTimeLeft = Math.max(0, evoTimeLeft - dt);
      updateEvolutionShieldHUD();
      if (evoTimeLeft <= 0) {
        completeEvolutionMode();
      }
    }

    const targetEvoBlend = (evoState === EVO_STATE_ACTIVE) ? 1.0 : 0.0;
    evoVisualBlend += (targetEvoBlend - evoVisualBlend) * Math.min(1, dt * 8);
    updateEvolutionVisuals(animTime, evoVisualBlend);

    // 4. Coordinated Obstacle & Energy Route Spawner + Random Skill Spawner
    if (spawn <= 0) {
      spawnCoordinatedWave();
      const reactionTime = Math.max(0.62, 1.18 - speedStage * 0.05);
      spawn = reactionTime + Math.random() * 0.32;
    }
    if (skillSpawnTimer <= 0) {
      trySpawnRandomSkillCollectible();
      skillSpawnTimer = 8.5 + Math.random() * 5.5;
    }

    // 5. Responsive Lane Switching
    const laneLerp = 1 - Math.exp(-22 * dt);
    tiger.position.x += (targetLaneX - tiger.position.x) * laneLerp;

    // 6. Jump & Slide Timers
    jump = Math.max(0, jump - dt);
    slide = Math.max(0, slide - dt);
    const jumpProgress = jump > 0 ? (JUMP_DURATION - jump) / JUMP_DURATION : 0;
    const jumpOffset = jump > 0 ? Math.sin(jumpProgress * Math.PI) * JUMP_HEIGHT : 0;

    // 7. Rolling-Ball Transformation
    const isRolling = slide > 0;
    const targetRollBlend = isRolling ? 1 : 0;
    rollBlend += (targetRollBlend - rollBlend) * Math.min(1, dt * 18);

    if (isRolling) {
      rollAngle -= dt * (13.5 + speed * 0.25);
    } else {
      const twoPi = Math.PI * 2;
      rollAngle = ((rollAngle % twoPi) + twoPi) % twoPi;
      if (rollAngle > Math.PI) rollAngle -= twoPi;
      rollAngle *= Math.max(0, 1 - dt * 16);
    }

    tiger.position.y = 0.25 + jumpOffset - rollBlend * 0.16;
    tigerRollPivot.rotation.x = rollAngle;
    tigerRollPivot.scale.set(
      1 + rollBlend * 0.08,
      1 - rollBlend * 0.28,
      1 - rollBlend * 0.42
    );

    head.position.set(0, 1.22 - rollBlend * 0.36, -1.14 + rollBlend * 0.48);
    head.rotation.x = rollBlend * 0.85;
    head.rotation.y = 0;

    tail.position.set(0, 0.94 - rollBlend * 0.24, 1.00 - rollBlend * 0.40);
    tail.rotation.x = rollBlend * 0.95 + (1 - rollBlend) * Math.sin(animTime * 6) * 0.06;
    tail.rotation.z = (1 - rollBlend) * Math.sin(animTime * 8) * 0.10;

    legs.forEach((l, i) => {
      const [lx, lz, isFront] = legCoords[i];
      const side = lx < 0 ? -1 : 1;
      l.position.set(
        side * (isFront ? 0.29 : 0.25) + side * (rollBlend * 0.06),
        0.80 + rollBlend * 0.10,
        lz * (1 - rollBlend * 0.35)
      );
      if (rollBlend > 0.05) {
        const runRot = Math.sin(animTime * (12 + speed * 0.32) + (i % 2) * Math.PI + (i > 1 ? Math.PI * 0.5 : 0)) * 0.68;
        const tuckRot = isFront ? 1.25 : -1.25;
        l.rotation.x = runRot * (1 - rollBlend) + tuckRot * rollBlend;
      } else if (jump > 0 || isRocketActive) {
        l.rotation.x = (i < 2 ? -0.34 : 0.40);
      } else {
        l.rotation.x = Math.sin(animTime * (12 + speed * 0.32) + (i % 2) * Math.PI + (i > 1 ? Math.PI * 0.5 : 0)) * 0.68;
      }
    });

    // 8. Rocket Jump & Active Skill Visuals
    const showPlumes = (jump > 0 || isRocketActive) && !isRolling;
    rocketPlumes.forEach((p, idx) => {
      p.group.visible = showPlumes;
      if (showPlumes) {
        const flicker = 0.82 + 0.34 * Math.sin(animTime * 45 + idx * 1.7);
        const boostScale = isRocketActive ? 1.35 : 1.0;
        p.outerCone.scale.set(1, flicker * boostScale, 1);
        p.innerCone.scale.set(1, (0.88 + 0.25 * Math.cos(animTime * 52 + idx)) * boostScale, 1);
        p.nozzleRing.scale.setScalar(0.92 + 0.12 * Math.sin(animTime * 30));
        p.sparks.forEach((sp, sIdx) => {
          const cycle = ((animTime * 7 + sIdx * 0.33 + idx * 0.2) % 1);
          sp.position.y = -0.18 - cycle * 0.48;
          const sScale = (1 - cycle) * 1.15;
          sp.scale.setScalar(Math.max(0.01, sScale));
          sp.rotation.y += dt * 9;
        });
      }
    });

    rocketDashShield.visible = revivalProtectionTimer > 0;
    if (rocketDashShield.visible) {
      const shieldPulse = 1 + 0.035 * Math.sin(animTime * 7);
      rocketDashShield.scale.set(0.82 * shieldPulse, 1.02 * shieldPulse, 0.78 * shieldPulse);
      rocketDashShield.rotation.y = animTime * 0.7;
      rocketDashShieldMat.opacity = 0.13 + 0.035 * Math.sin(animTime * 8);
    }

    const isMagnetActive = activeSkillTimers.magnet > 0;
    magnetFieldRing.visible = isMagnetActive;
    if (isMagnetActive) {
      magnetFieldRing.rotation.z = -animTime * 4.5;
      magnetFieldRing.scale.setScalar(1 + 0.12 * Math.sin(animTime * 10));
    }

    // 9. World Scrolling
    roadTex.offset.y -= speed * dt * 0.06;
    for (const d of dashes) {
      d.position.z += speed * dt;
      if (d.position.z > 14) d.position.z -= 125;
    }
    for (const t of trees) {
      t.position.z += speed * dt * 0.82;
      if (t.position.z > 16) t.position.z = -102 - Math.random() * 12;
    }

    for (let i = pickupBursts.length - 1; i >= 0; i--) {
      const b = pickupBursts[i];
      b.age += dt * 3.8;
      b.mesh.scale.setScalar(1 + b.age * 2.4);
      b.mat.opacity = Math.max(0, 0.9 - b.age);
      if (b.age >= 0.9) {
        scene.remove(b.mesh);
        pickupBursts.splice(i, 1);
      }
    }

    // 10. Item Movement, Magnet Attraction & Collision Detection
    const tigerCenterY = tiger.position.y + (isRolling ? 0.45 : 0.72);
    const isRocketProtected = isRocketActive || rocketGraceTimer > 0 || revivalProtectionTimer > 0;

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.g.position.z += speed * dt;

      if (it.type === 'orb') {
        it.g.rotation.y += dt * 2.6;
        if (isMagnetActive && !it.hit) {
          const distZ = tiger.position.z - it.g.position.z;
          const distX = tiger.position.x - it.g.position.x;
          const distSq = distZ * distZ + distX * distX;
          if (distSq < MAGNET_ATTRACT_RADIUS * MAGNET_ATTRACT_RADIUS && distZ > -1.5) {
            const pull = Math.min(1, dt * 11.5);
            it.g.position.x += (tiger.position.x - it.g.position.x) * pull;
            it.g.position.y += ((tigerCenterY - 0.35) - it.g.position.y) * pull;
            it.g.position.z += (tiger.position.z - it.g.position.z) * (pull * 0.55);
          }
        }
      } else if (isSkillType(it.type)) {
        it.g.rotation.y += dt * 3.2;
        it.g.position.y = it.baseY + Math.sin(animTime * 5 + it.z) * 0.08;
      }

      const dz = Math.abs(it.g.position.z - tiger.position.z);
      const dx = Math.abs(it.g.position.x - tiger.position.x);

      if (dz < 0.82 && dx < 0.84 && !it.hit) {
        if (it.type === 'orb') {
          const orbWorldY = it.g.position.y + 0.35;
          const dy = Math.abs(orbWorldY - tigerCenterY);
          if (dy <= 1.05) {
            it.hit = true;
            spawnPickupBurst(it.g.position.x, orbWorldY, it.g.position.z);
            scene.remove(it.g);
            items.splice(i, 1);
            collectEnergyParticle();
          }
          continue;
        }

        if (isSkillType(it.type)) {
          const skillWorldY = it.g.position.y + 0.38;
          const dy = Math.abs(skillWorldY - tigerCenterY);
          if (dy <= 1.15) {
            it.hit = true;
            const skillKey = it.type.replace('skill_', '');
            const burstColor = skillKey === 'magnet' ? 0xff3b6b : (skillKey === 'rocket' ? 0xff8c2b : 0xffe866);
            spawnPickupBurst(it.g.position.x, skillWorldY, it.g.position.z, burstColor);
            scene.remove(it.g);
            items.splice(i, 1);
            activateCollectedSkill(skillKey);
          }
          continue;
        }

        const safe = (evoState === EVO_STATE_ACTIVE) ||
                     isRocketProtected ||
                     (it.type === 'low' && jumpOffset > 0.42) ||
                     ((it.type === 'high' || it.type === 'gate') && slide > 0 && jumpOffset < 0.25);
        if (!safe) {
          end();
          break;
        } else {
          it.hit = true;
        }
      }
      if (it.g.position.z > 13) {
        scene.remove(it.g);
        items.splice(i, 1);
      }
    }
    scoreEl.textContent = Math.floor(score);
  }

  camera.position.x += (tiger.position.x * 0.22 - camera.position.x) * dt * 2;
  currentCamLook.set(tiger.position.x * 0.18, 1.1, -3);
  camera.lookAt(currentCamLook);

  for (const l of laneLights) {
    l.position.z += running ? speed * dt : 0;
    if (l.position.z > 14) l.position.z -= 120;
  }

  const lateralDelta = targetLaneX - tiger.position.x;
  tiger.rotation.z += (lateralDelta * -0.055 - tiger.rotation.z) * Math.min(1, dt * 10);
  tiger.rotation.y += (lateralDelta * 0.045 - tiger.rotation.y) * Math.min(1, dt * 8);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});
</script>
</body>
</html>
